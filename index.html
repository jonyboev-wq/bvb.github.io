<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BVB — официальный магазин</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="logo.png">
<meta name="description" content="Каталог товаров BVB. Официальная страница магазина." />
</head>
<body>
<header>
  <div class="container nav">
    <div class="brand">
      <img src="logo.png" alt="BVB" class="brand-logo">
      <div>
        <small>Официальная страница магазина</small>
      </div>
    </div>
    <div class="nav-actions">
      <a class="btn" href="index.html#catalog">Каталог</a>
      <a class="btn" href="wholesale.html">Опт</a>
      <button class="btn icon" id="themeToggle" aria-label="Переключить тему">🌙</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h2>Лучшие товары по честным ценам</h2>
    <p>Мы тщательно отбираем ассортимент и отправляем заказы по всей стране. Для оптовых покупателей — специальные условия.</p>
  </section>

  <section class="socials" id="socials">
    <!-- icons will be injected -->
  </section>

  <section id="catalog">
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="container">
  © <span id="year"></span> BVB. Все права защищены.
</footer>

<script>
// ===== Theme =====
(function(){
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const b = document.getElementById('themeToggle');
  b.textContent = saved === 'dark' ? '☀️' : '🌙';
  b.addEventListener('click',()=>{
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    localStorage.setItem('theme', cur);
    b.textContent = cur === 'dark' ? '☀️' : '🌙';
  });
})();

// ===== Icons =====
const ICONS = {
  avito: `<svg class="icon-soc" viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="7" r="3"/><circle cx="16" cy="6" r="2"/><circle cx="18" cy="14" r="3"/><circle cx="8" cy="17" r="2.5"/></svg>`,
  tg: `<svg class="icon-soc" viewBox="0 0 24 24" fill="currentColor"><path d="M9.036 15.47l-.38 5.36c.54 0 .78-.23 1.06-.51l2.54-2.43 5.25 3.84c.97.53 1.66.25 1.93-.89l3.47-16.27c.31-1.44-.52-2-1.46-1.65L1.05 9.22C-.35 9.78-.33 10.62.81 10.98l5.2 1.62L19.38 5.2c.62-.4 1.18-.18.72.22"/></svg>`,
  wa: `<svg class="icon-soc" viewBox="0 0 24 24" fill="currentColor"><path d="M20 3.9A10 10 0 004 18.6L3 22l3.5-.9A10 10 0 1019.9 4L20 3.9zm-8 16a8 8 0 110-16 8 8 0 010 16z"/></svg>`
};

// ===== Data load with fallback =====
const FALLBACK = {
  socials:[
    {label:"Авито Москва", url:"https://www.avito.ru/brands/i184536091?src=sharing", icon:"avito"},
    {label:"Авито Новосибирск", url:"https://www.avito.ru/user/1f5f6349b1b4e5e061c17ae33aae143c/profile?src=sharing", icon:"avito"},
    {label:"Telegram", url:"https://t.me/bvbvbabab", icon:"tg"},
    {label:"WhatsApp", url:"https://wa.me/79831289090", icon:"wa"}
  ],
  products:[
    {
      title:"Лыжные скрепки Fischer",
      slug:"fischer-clips",
      price:99,
      tag:"Хит продаж",
      desc:"Прочные скрепки для лыж Fischer.",
      avitoUrl:"https://www.avito.ru/brands/i184536091?src=sharing",
      images:[
        "https://raw.githubusercontent.com/jonyboev-wq/bvb.github.io/main/IMG_3280.jpeg",
        "https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=1600&auto=format&fit=crop"
      ]
    },
    {
      title:"Рюкзак городской",
      slug:"urban-backpack",
      price:2990,
      tag:"Новинка",
      desc:"Лёгкий, износостойкий материал, отделение 15”.",
      avitoUrl:"https://www.avito.ru/brands/i184536091?src=sharing",
      images:[
        "https://images.unsplash.com/photo-1523419409543-a7cbe5c0f7d4?q=80&w=1600&auto=format&fit=crop"
      ]
    }
  ]
};

async function loadConfig(){
  try{
    const res = await fetch('shopConfig.json',{cache:'no-store'});
    if(!res.ok) throw new Error('no file');
    const data = await res.json();
    return data;
  }catch(e){
    return FALLBACK;
  }
}

function rubl(n){ try{ return new Intl.NumberFormat('ru-RU').format(n) + ' ₽'; }catch(_){ return n + ' ₽'; } }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function slugify(s){ return (s||'').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,''); }
const AVITO_NSK_URL = 'https://www.avito.ru/novosibirsk/sport_i_otdyh/1_para_lyzhnyh_skrepok_fisher_4750131835?utm_campaign=native&utm_medium=item_page_android&utm_source=soc_sharing_seller';

function renderSocials(items){
  const wrap=document.getElementById('socials'); wrap.innerHTML='';
  items.forEach(s=>{
    const button=el(`<a class="btn small" target="_blank" rel="noopener">${ICONS[s.icon]||''}<span>${s.label}</span></a>`);
    button.href=s.url; wrap.appendChild(button);
  });
}

function renderGrid(items){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  items.forEach(p=>{
    const images = Array.isArray(p.images) && p.images.length ? p.images.filter(Boolean) : [];
    const safeImages = images.length ? images : [''];
    const hasGallery = safeImages.length > 1;
    const dotsHtml = hasGallery
      ? `<div class="card-gallery-dots">${
          safeImages.map((_, i)=>`<button type="button" class="card-gallery-dot${i===0?' active':''}" data-dot-index="${i}" aria-label="Фото ${i+1}"></button>`).join('')
        }</div>`
      : '';
    const galleryControls = hasGallery
      ? `
          <button type="button" class="card-gallery-nav prev" data-shift="-1" aria-label="Предыдущее фото">‹</button>
          <button type="button" class="card-gallery-nav next" data-shift="1" aria-label="Следующее фото">›</button>
          ${dotsHtml}
        `
      : '';
    const card=el(`
      <article class="card">
        <a href="product.html?slug=${encodeURIComponent(p.slug || slugify(p.title))}">
          <div class="card-img${hasGallery ? ' has-gallery' : ''}">
            <img src="${safeImages[0]}" alt="${p.title}" loading="lazy">
            ${galleryControls}
          </div>
          <div class="card-pad">
            <h3 style="margin:0 0 6px">${p.title}</h3>
            ${p.tag? `<div class="badge">${p.tag}</div>`:''}
            <p class="card-pad" style="padding:8px 0 0;margin:0;color:var(--muted)">${p.desc||''}</p>
            <div class="price">${rubl(p.price)}</div>
          </div>
        </a>
        <div class="card-actions">
          <a class="btn small" target="_blank" rel="noopener" href="${p.avitoUrl||'#'}">Авито Мск</a>
          <a class="btn small" target="_blank" rel="noopener" href="${p.avitoNskUrl||AVITO_NSK_URL}">Авито Нск</a>
          <a class="btn small primary" href="product.html?slug=${encodeURIComponent(p.slug || slugify(p.title))}">Подробнее</a>
        </div>
      </article>
    `);
    if(hasGallery){
      const imageEl = card.querySelector('.card-img img');
      const galleryEl = card.querySelector('.card-img');
      const linkEl = card.querySelector('a');
      const dots = [...card.querySelectorAll('[data-dot-index]')];
      let currentPhotoIndex = 0;
      let activePointerId = null;
      let startX = 0;
      let startY = 0;
      let swipeHandled = false;
      let preventNextClick = false;

      const setPhoto = (nextIndex)=>{
        currentPhotoIndex = (nextIndex + safeImages.length) % safeImages.length;
        imageEl.src = safeImages[currentPhotoIndex];
        dots.forEach((dot, i)=>dot.classList.toggle('active', i === currentPhotoIndex));
      };

      card.querySelectorAll('[data-shift]').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.preventDefault();
          e.stopPropagation();
          setPhoto(currentPhotoIndex + Number(btn.dataset.shift));
        });
      });

      dots.forEach(dot=>{
        dot.addEventListener('click', e=>{
          e.preventDefault();
          e.stopPropagation();
          setPhoto(Number(dot.dataset.dotIndex));
        });
      });

      galleryEl.addEventListener('pointerdown', e=>{
        activePointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        swipeHandled = false;
      });

      galleryEl.addEventListener('pointermove', e=>{
        if(e.pointerId !== activePointerId || swipeHandled) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const horizontal = Math.abs(dx) > Math.abs(dy);
        if(!horizontal || Math.abs(dx) < 36) return;
        swipeHandled = true;
        preventNextClick = true;
        if(dx < 0){
          setPhoto(currentPhotoIndex + 1);
        }else{
          setPhoto(currentPhotoIndex - 1);
        }
      });

      const clearSwipe = ()=>{ activePointerId = null; swipeHandled = false; };
      galleryEl.addEventListener('pointerup', clearSwipe);
      galleryEl.addEventListener('pointercancel', clearSwipe);
      galleryEl.addEventListener('pointerleave', clearSwipe);

      linkEl.addEventListener('click', e=>{
        if(!preventNextClick) return;
        e.preventDefault();
        e.stopPropagation();
        preventNextClick = false;
      });
    }
    grid.appendChild(card);
  });
}

(async function init(){
  const cfg = await loadConfig();
  renderSocials(cfg.socials||[]);
  renderGrid(cfg.products||[]);
  document.getElementById('year').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
